# To turn this on: on github.com, add a file at .github/workflows/depth.yml in this
# repo and paste this in. (Workflow files can only be added from your account.)
#
# Builds real depth maps for new clips (Depth Anything V2) and commits them.
# Cloudflare redeploys on the commit. Runs every 6 hours, on demand, and when
# the portrait photo or the script changes.
name: Depth maps

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths: ["public/me/me.*", "scripts/depth.py", ".github/workflows/depth.yml"]

permissions:
  contents: write

concurrency:
  group: depth
  cancel-in-progress: false

jobs:
  depth:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: pip install -r scripts/requirements.txt

      - uses: actions/cache@v4
        with:
          path: .cache
          key: depth-anything-v2-small-dynamic

      - name: Build depth maps
        env:
          SITE_URL: https://aviram.app
        run: python scripts/depth.py

      - name: Commit
        run: |
          git add public/depth public/me
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "aviram depth bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update depth maps"
          git pull --rebase origin main
          git push
